[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "interviewbench"
version = "0.1.0"
description = "Realistic AI-era coding interview tasks with rubrics, a grader, and an LLM leaderboard."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
    "pytest>=8",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
judge = ["anthropic>=1.13,<2"]
# Harbor runs the LLM leaderboard (`harbor run -p tasks/<category>`); the tests use it to check
# every task is a valid Harbor task.
harbor = ["harbor>=0.24"]

[project.scripts]
interviewbench = "interviewbench.cli:app"
ib = "interviewbench.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/interviewbench"]

[tool.hatch.build.targets.wheel.force-include]
"tasks" = "interviewbench/_bench/tasks"
"rubrics" = "interviewbench/_bench/rubrics"
"templates" = "interviewbench/_bench/templates"

[tool.pytest.ini_options]
testpaths = ["tests"]
