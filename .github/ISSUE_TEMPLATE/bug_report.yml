name: Bug report
description: Something in ib or a task does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Security problems do not go here. Report them privately as described in SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you saw. Paste the command and its output.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The shortest list of commands that shows the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ib version
      description: Output of `ib --version`
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      description: Output of `python --version`
    validations:
      required: true
  - type: dropdown
    id: runner
    attributes:
      label: Runner
      description: Where the tests ran
      options:
        - docker
        - local
        - not sure
    validations:
      required: true
  - type: input
    id: task
    attributes:
      label: Task
      description: The task id, if the problem is in a task (for example rate-limiter)
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Output or traceback
      render: text
    validations:
      required: false
