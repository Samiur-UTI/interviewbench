name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 3.10 is the oldest supported Python. Harbor installs from 3.12, so its checks run there.
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      # The local runner runs the TypeScript tasks with the Node on PATH.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install "ruff>=0.8"
      # The rules are in pyproject.toml.
      - run: ruff check src tests

  docker:
    name: Tasks in containers
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      # Every task's starter and reference solutions, in the task's own image, as Harbor runs them.
      - run: python -m pytest -q tests/test_tasks.py tests/test_format.py
        env:
          IB_TEST_RUNNER: docker
