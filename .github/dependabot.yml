version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # One pull request for all action bumps: separate ones edit neighbouring lines of the same
    # workflow files and conflict with each other as soon as the first one merges.
    groups:
      actions:
        patterns: ["*"]
    # Wait a week after a release before proposing it, so a broken or compromised release has time
    # to be pulled. Security updates are not delayed.
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
