schema_version = "1.4"
# Harbor's trial reward is the mean of the three stage rewards (each = fraction of hidden tests passed).
multi_step_reward_strategy = "mean"

[task]
name = "interviewbench/flight-search-aggregator"
version = "2.0.0"
description = "Multi-supplier flight search: nested fares, DB-backed paging, 1 s budget"
authors = [{ name = "Samiur-UTI" }]
keywords = ["typescript", "nodejs", "sqlite", "pagination", "worker-threads", "performance"]

[metadata]
category = "backend"                       # must match the folder: tasks/backend/
tags = ["typescript", "nodejs", "sqlite", "pagination", "concurrency", "worker-threads", "performance", "parsing", "travel"]
difficulty = "hard"                        # Harbor vocabulary: easy | medium | hard
expert_time_estimate_min = 100
junior_time_estimate_min = 300

[metadata.interviewbench]
level = "senior"                           # junior | mid | senior
language = "typescript"
time_limit_minutes = 180
# How the candidate's own tests are run (from $APP_DIR). Needs Node.js >= 24.11 (built-in type
# stripping); with the local runner that means on the host. tests/exit-guard.mjs replaces
# --test-force-exit, which drops results at random (see tests/test.sh).
candidate_tests = 'node --import ./tests/exit-guard.mjs --no-warnings=ExperimentalWarning --test --test-timeout=20000 --test-reporter=junit --test-reporter-destination="$LOGS_DIR/junit.xml" --test-reporter=spec --test-reporter-destination=stdout "tests/**/*.test.ts"'

[[steps]]
name = "stage-1"
[steps.agent]
timeout_sec = 2400

[[steps]]
name = "stage-2"
[steps.agent]
timeout_sec = 2400

[[steps]]
name = "stage-3"
[steps.agent]
timeout_sec = 2400

[verifier]
# Worst case (every test hangs until its per-test timeout): stage 2, 16 x 20 s = 320 s; stage 3,
# 7 x 60 s + 3 x 20 s + 2 x 60 s = 600 s. See tests/test.sh.
timeout_sec = 720

[environment]
build_timeout_sec = 600
cpus = 2                                   # stage 3 measures event-loop responsiveness with 1 parser thread
memory_mb = 4096
