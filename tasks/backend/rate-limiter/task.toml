schema_version = "1.4"
# Harbor's trial reward is the mean of the three stage rewards (each = fraction of hidden tests passed).
multi_step_reward_strategy = "mean"

[task]
name = "interviewbench/rate-limiter"
version = "1.0.0"
description = "Per-key token-bucket rate limiter"
authors = [{ name = "Samiur-UTI" }]
keywords = ["python", "algorithms", "performance"]

[metadata]
category = "backend"                       # must match the folder: tasks/backend/
tags = ["python", "algorithms", "performance", "memory"]
difficulty = "medium"                      # Harbor vocabulary: easy | medium | hard
expert_time_estimate_min = 30
junior_time_estimate_min = 90

[metadata.interviewbench]
level = "mid"                              # junior | mid | senior
language = "python"
time_limit_minutes = 60
# How the candidate's own tests are run (from $APP_DIR). Must write JUnit XML to $LOGS_DIR/junit.xml.
candidate_tests = '"${PYTHON:-python}" -m pytest -q -p no:cacheprovider --junitxml="$LOGS_DIR/junit.xml"'

[[steps]]
name = "stage-1"
[steps.agent]
timeout_sec = 1200

[[steps]]
name = "stage-2"
[steps.agent]
timeout_sec = 1200

[[steps]]
name = "stage-3"
[steps.agent]
timeout_sec = 1200

[verifier]
timeout_sec = 180

[environment]
build_timeout_sec = 600
cpus = 1
memory_mb = 2048
