# Inherits rubrics/base.yaml and rubrics/backend.yaml. Entries below add criteria or override
# inherited ones by id. Total weight: 45 auto + 55 judge = 100.

focus: |
  Watch for eviction that changes observable results, float rounding in retry_after, and fixes
  that cap tokens in RateLimiter instead of TokenBucket.

business: |
  The limiter guards a shared API platform. Customers buy plans defined by a burst (capacity)
  and a sustained rate (refill_rate); every service relies on the library to enforce them.

  Rules (each stated or implied by the brief):
  - A customer never gets more than their plan allows: at most `capacity` requests in a burst,
    however long they were idle (stage 1 incident).
  - A customer always gets what they pay for: after an idle period the full burst is available.
    Fixes that over-throttle (resetting tokens to 0, capping below capacity) break paying customers.
  - retry_after is a promise to clients: waiting exactly that long must succeed. Rounding must
    err towards a slightly longer wait, never a shorter one that earns another 429 (stage 2).
  - Requests that can never succeed (cost > capacity) or make no sense (cost <= 0) are client
    bugs and must fail loudly with ValueError, not be silently throttled forever (stage 2).
  - Eviction is invisible to customers: forgetting a key must never hand it extra tokens or
    take any away (stage 3).

  Priorities when they conflict: never exceeding a plan > never under-serving a plan > memory
  and speed.

criteria:
  - id: stage1-bug-fixed
    type: auto
    stage: 1
    weight: 15
    description: Hidden stage 1 tests pass (bursts after idle periods are capped at capacity).

  - id: stage2-feature
    type: auto
    stage: 2
    weight: 15
    description: Hidden stage 2 tests pass (retry_after is correct and side-effect free; invalid costs raise).

  - id: stage3-scales
    type: auto
    stage: 3
    weight: 15
    description: Hidden stage 3 tests pass (idle keys evicted, behaviour unchanged, amortized O(1)).

  - id: correctness
    weight: 10
    levels:
      0: Wrong in common cases, or the candidate's tests fail.
      1: Works for the tested paths but has a real bug the tests miss (e.g. eviction changes results).
      2: Correct, with at most minor edge-case gaps.
      3: Correct, including float rounding, invalid input, and eviction boundary cases.

  - id: root-cause
    description: Fixes the root cause in the token refill logic instead of patching symptoms in callers.
    levels:
      0: No fix, or the change only hides the symptom (e.g. special-casing in RateLimiter).
      1: The fix works but lives in the wrong layer or duplicates logic.
      2: Refill is capped at capacity inside TokenBucket.
      3: As 2, and NOTES.md explains why the bug only appeared after idle periods.

  - id: code-quality
    weight: 5
    levels:
      0: Hard to follow, or breaks the existing public API.
      1: Works but adds unnecessary complexity or duplication.
      2: Clear and consistent with the codebase.
      3: Clear, minimal, and handles edge cases (float precision, invalid input) cleanly.

  - id: verification
    levels:
      0: No new tests.
      1: Some tests, but they would not have caught the original bug.
      2: A regression test for the bug plus tests for retry_after.
      3: As 2, plus tests for eviction and edge cases, using FakeClock instead of sleeping.

  - id: communication
    weight: 5

  - id: business-alignment
    weight: 5
    levels:
      0: Breaks a plan (bursts above capacity after idle, eviction that grants free tokens) or over-throttles paying customers.
      1: Plans are enforced, but a judgement call hurts clients (e.g. retry_after can round to a wait slightly too short for some rates).
      2: Plans are enforced exactly in both directions, and every judgement call favours the customer contract.
