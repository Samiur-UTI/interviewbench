firewalls:
  - name: quay-prod-control-plane
    apply_to: {role: control-plane}
    inbound:
      - description: Kubernetes API
        protocol: tcp
        ports: "6443"
        sources: ["0.0.0.0/0"]
      - description: etcd
        protocol: tcp
        ports: "2379-2380"
        sources: ["0.0.0.0/0"]
      - description: kubelet
        protocol: tcp
        ports: "10250"
        sources: ["0.0.0.0/0"]
      - description: kubelet read-only
        protocol: tcp
        ports: "10255"
        sources: ["0.0.0.0/0"]
      - description: ssh
        protocol: tcp
        ports: "22"
        sources: ["0.0.0.0/0"]
      - description: overlay (flannel vxlan)
        protocol: udp
        ports: "8472"
        sources: ["10.20.0.0/24"]

  - name: quay-prod-workers
    apply_to: {role: worker}
    inbound:
      - description: ingress http
        protocol: tcp
        ports: "80"
        sources: ["0.0.0.0/0"]
      - description: ingress https
        protocol: tcp
        ports: "443"
        sources: ["0.0.0.0/0"]
      - description: NodePorts
        protocol: tcp
        ports: "30000-32767"
        sources: ["0.0.0.0/0"]
      - description: kubelet
        protocol: tcp
        ports: "10250"
        sources: ["0.0.0.0/0"]
      - description: kubelet read-only
        protocol: tcp
        ports: "10255"
        sources: ["0.0.0.0/0"]
      - description: ssh
        protocol: tcp
        ports: "22"
        sources: ["0.0.0.0/0"]
      - description: overlay (flannel vxlan)
        protocol: udp
        ports: "8472"
        sources: ["10.20.0.0/24"]
