apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: storefront
  labels:
    app: storefront
spec:
  replicas: 3
  selector:
    matchLabels:
      app: storefront
  template:
    metadata:
      labels:
        app: storefront
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: storefront
          image: registry.quayside.example/quayside/storefront:3.8.1
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: ORDERS_URL
              value: http://orders-api.orders.svc.cluster.local
            - name: PAYMENTS_URL
              value: http://payments-api.payments.svc.cluster.local
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              memory: 512Mi
