# Vault Agent's configuration for the payments pods (docs/standards/vault-clients.md). It logs in
# with the pod's projected token for audience vault and renders the Stripe values from
# kv/payments/stripe into /vault/secrets/stripe.json, the file the payments container reads
# (STRIPE_CREDENTIALS_FILE). No token sink: the Vault token stays in the agent's memory.
apiVersion: v1
kind: ConfigMap
metadata:
  name: payments-vault-agent
  namespace: payments
data:
  agent.hcl: |
    vault {
      address = "https://vault.platform.quayside.example:8200"
      ca_cert = "/vault/ca/ca.crt"
    }

    auto_auth {
      method "kubernetes" {
        mount_path = "auth/k8s-quay-prod-fra1"
        config = {
          role       = "payments-api"
          token_path = "/var/run/secrets/vault/token"
        }
      }
    }

    template {
      source      = "/vault/config/stripe.json.ctmpl"
      destination = "/vault/secrets/stripe.json"
      perms       = "0440"
    }
  # toJSON quotes and escapes each value, so the file is valid JSON whatever the values contain.
  stripe.json.ctmpl: |
    {{- with secret "kv/data/payments/stripe" -}}
    {
      "secret_key": {{ .Data.data.secret_key | toJSON }},
      "webhook_secret": {{ .Data.data.webhook_secret | toJSON }}
    }
    {{ end -}}
