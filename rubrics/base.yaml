# Criteria every task inherits. A category rubric (rubrics/<category>.yaml) adds to these, and a
# task's rubric.yaml adds its `auto` criteria and can override or exclude anything by id.
# Merge rule: same id -> fields are replaced (levels as a whole); final weights must total 100.

focus: |
  Judge what was submitted, not what was intended. Prefer the simplest change that fixes the
  root cause and fits the existing design.

criteria:
  - id: correctness
    type: judge
    weight: 15
    description: The code is correct beyond what the hidden tests check, and the candidate's own tests pass.
    levels:
      0: Wrong in common cases, or the candidate's tests fail.
      1: Works for the tested paths but has a real bug the tests miss.
      2: Correct, with at most minor edge-case gaps.
      3: Correct, including edge cases and invalid input.

  - id: root-cause
    type: judge
    weight: 10
    description: Fixes the root cause of the bug instead of patching its symptoms.
    levels:
      0: No fix, or the change only hides the symptom.
      1: The fix works but lives in the wrong layer or duplicates logic.
      2: The fix is in the right place.
      3: As 2, and NOTES.md explains why the bug happened.

  - id: code-quality
    type: judge
    weight: 10
    description: Changes are small, readable, and fit the existing design and API.
    levels:
      0: Hard to follow, or breaks the existing public API.
      1: Works but adds unnecessary complexity or duplication.
      2: Clear and consistent with the codebase.
      3: Clear, minimal, and handles edge cases cleanly.

  - id: verification
    type: judge
    weight: 10
    description: Adds or updates tests that would have caught the bug and cover the new behaviour.
    levels:
      0: No new tests.
      1: Some tests, but they would not have caught the original bug.
      2: A regression test for the bug plus tests for the new feature.
      3: As 2, plus tests for the optimization and edge cases.

  # Scored against the task rubric's `business` section, which every task using this criterion
  # must provide. Each rule there must be stated or clearly implied by the brief or starter repo.
  - id: business-alignment
    type: judge
    weight: 10
    description: The solution serves the business need behind the brief and respects its business rules, including in judgement calls the tests don't pin down.
    levels:
      0: Breaks a business rule, or a judgement call works against the users or business the brief describes.
      1: Respects the explicit rules, but a judgement call (defaults, limits, rounding, failure behaviour) goes against the business need.
      2: Respects every rule, and judgement calls favour what the business needs.

  - id: communication
    type: judge
    weight: 10
    description: NOTES.md explains findings, changes, trade-offs, and how AI assistance was used and checked.
    levels:
      0: Empty or missing.
      1: Lists changes only.
      2: Explains root cause, changes, and trade-offs.
      3: As 2, and says what the AI got wrong or what was verified by hand.
